name: FusionSolar Charger
version: "1.0.2"
slug: fusionsolar_charger
url: https://github.com/jterpstra1/fusionsolar-charger
description: Huawei SCharger data from FusionSolar, with monthly kWh and full charging history
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
options:
  username: ""
  password: ""
  subdomain: region01eu5
  charger_sn: ""
  entity_prefix: scharger
  interval: 300
  backfill: true
  backfill_from: ""
schema:
  username: str
  password: password
  subdomain: str
  charger_sn: str?
  entity_prefix: match(^[a-z][a-z0-9_]*$)
  interval: int(60,3600)
  backfill: bool
  backfill_from: match(^(\d{4}-\d{2}-\d{2})?$)?
